name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run test:plugin
      - run: bun run test:sdk
      - name: Python SDK tests
        working-directory: packages/sdk-python
        run: python3 -m unittest discover -s tests -t .
      - name: Enterprise checks (private repo only)
        if: ${{ hashFiles('packages/enterprise/package.json') != '' }}
        run: |
          bun run typecheck:all
          bun run test:ee

  sdk-dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build packages/sdk-dotnet/Torrix.Sdk.csproj -c Release

  sdk-java:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: mvn -B -q -f packages/sdk-java/pom.xml package
