name: Release binaries

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binaries:
    # Binaries are published from the public Community repository only.
    if: github.repository == 'TorrixAI/torrix'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check the tree is the Community edition
        run: |
          if [ -e packages/enterprise ]; then
            echo "Enterprise code found, refusing to publish Community binaries" >&2
            exit 1
          fi

      - name: Check the tag matches the server version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(grep -oE 'version: "[0-9]+\.[0-9]+\.[0-9]+"' packages/server/src/core/config.ts | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match server version $version" >&2
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Build every target
        run: bun run compile:all

      - name: Smoke test the Linux x64 build
        run: |
          chmod +x dist/torrix-linux-x64
          data="$(mktemp -d)"
          DB_PATH="$data/torrix.sqlite" PORT=18099 TORRIX_OPEN_BROWSER=false TORRIX_TELEMETRY=false TORRIX_PRICING_SYNC=false ./dist/torrix-linux-x64 >"$data/log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18099/health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18099/health | grep -q '"name":"Torrix"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18099/ui/agents)" = "302"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18099/api/v1/agents)" = "404"
          ./dist/torrix-linux-x64 --version

      - name: Checksums
        run: |
          cd dist
          sha256sum torrix-* > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: torrix-binaries
          path: |
            dist/torrix-*
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md for this release."
          gh release upload "$GITHUB_REF_NAME" dist/torrix-* dist/SHA256SUMS --clobber
