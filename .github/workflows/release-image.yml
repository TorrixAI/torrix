name: Release image

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    # Only the public Community repository publishes images.
    if: github.repository == 'TorrixAI/torrix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tree is the Community edition
        run: |
          if [ -e packages/enterprise ]; then
            echo "Enterprise code found, refusing to publish a public image" >&2
            exit 1
          fi

      - name: Check the tag matches the server version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(grep -oE 'version: "[0-9]+\.[0-9]+\.[0-9]+"' packages/server/src/core/config.ts | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match server version $version" >&2
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            gettorrixai/torrix
            ghcr.io/torrixai/torrix
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=Torrix
            org.opencontainers.image.description=Self-hosted LLM observability: traces, cost, evals and a proxy for any provider
            org.opencontainers.image.licenses=FSL-1.1-ALv2
            org.opencontainers.image.url=https://github.com/TorrixAI/torrix

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Needs a Docker Hub token with Read, Write, Delete scope; the images are already pushed.
      - name: Update the Docker Hub description
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: gettorrixai/torrix
          short-description: Self-hosted LLM observability. Traces, cost, evals and a proxy for any provider.
          readme-filepath: ./deploy/docker/DOCKERHUB.md
