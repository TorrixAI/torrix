{{- if and .Values.postgres.url (not .Values.postgres.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "torrix.fullname" . }}
  labels:
    {{- include "torrix.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ include "torrix.databaseSecretKey" . }}: {{ .Values.postgres.url | quote }}
{{- end }}
