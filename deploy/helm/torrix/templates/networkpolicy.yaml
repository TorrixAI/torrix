{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "torrix.fullname" . }}
  labels:
    {{- include "torrix.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "torrix.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress.restrict }}
    - Egress
    {{- end }}
  ingress:
    - ports:
        - port: http
          protocol: TCP
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.networkPolicy.egress.restrict }}
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- range .Values.networkPolicy.protectedDownstreams }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace | quote }}
          podSelector:
            {{- toYaml .podSelector | nindent 12 }}
      {{- with .ports }}
      ports:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
    {{- with .Values.networkPolicy.egress.allowTo }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- $root := . }}
{{- range .Values.networkPolicy.protectedDownstreams }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-only-via-torrix" .name | trunc 63 | trimSuffix "-" }}
  namespace: {{ .namespace }}
  labels:
    {{- include "torrix.labels" $root | nindent 4 }}
spec:
  podSelector:
    {{- toYaml .podSelector | nindent 4 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $root.Release.Namespace | quote }}
          podSelector:
            matchLabels:
              {{- include "torrix.selectorLabels" $root | nindent 14 }}
      {{- with .ports }}
      ports:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
