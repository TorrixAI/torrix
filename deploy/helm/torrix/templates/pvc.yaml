{{- if and .Values.persistence.enabled (not .Values.postgres.url) (not .Values.postgres.existingSecret) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "torrix.fullname" . }}
  labels:
    {{- include "torrix.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- range .Values.persistence.accessModes }}
    - {{ . }}
    {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
{{- end }}
