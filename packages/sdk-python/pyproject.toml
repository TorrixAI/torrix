[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "torrix-sdk"
version = "1.3.0"
description = "Python SDK for Torrix, self-hosted observability for AI agents: record OpenAI and Anthropic calls with no dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Torrix" }]
keywords = ["llm", "observability", "ai-agents", "openai", "anthropic", "tracing", "cost", "self-hosted"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries",
  "Topic :: System :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.30.0"]

[project.urls]
Homepage = "https://github.com/TorrixAI/torrix"
Documentation = "https://github.com/TorrixAI/torrix/blob/main/docs/integrations/python-sdk.md"
Issues = "https://github.com/TorrixAI/torrix/issues"

[tool.setuptools.packages.find]
include = ["torrix*"]

[tool.setuptools.package-data]
torrix = ["py.typed"]