<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f6f4" />
    <meta name="robots" content="noindex,nofollow" />
    <link rel="icon" type="image/svg+xml" href="/ui/assets/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/ui/assets/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/ui/assets/apple-touch-icon.png" />
    <script>(function(){var t="light";try{var s=localStorage.getItem("torrix_theme");t=(s==="light"||s==="dark")?s:(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme="light"}})();</script>
    <title>Torrix · AI Observability</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
